<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - Bean Scene</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Clicker+Script&family=Playfair+Display:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-box">
        <h2>Create Account</h2>
        <p class="auth-subtitle">
          Join Bean Scene to explore fresh coffee blends and exclusive offers.
        </p>

        <label for="regName">Full name</label>
        <input id="regName" placeholder="Full name" />

        <label for="regEmail">Email</label>
        <input id="regEmail" placeholder="Email" />

        <label for="regPhone">Phone number</label>
        <input id="regPhone" placeholder="Phone number" />

        <label for="regPass">Password</label>
        <input id="regPass" type="password" placeholder="Password" />

        <button id="regSubmit" class="btn">Register</button>

        <p class="muted">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById("regSubmit");
        if (btn) {
          btn.addEventListener("click", () => {
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const phone = document.getElementById("regPhone").value.trim();
            const pass = document.getElementById("regPass").value.trim();
            if (!name || !email || !phone || !pass)
              return alert("Please fill all fields.");
            registerUser({ name, email, phone, password: pass });
          });
        }
      });
    </script>
  </body>
</html>
